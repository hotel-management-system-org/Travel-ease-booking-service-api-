apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
      - name: booking-service
        image: booking-service:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service 
spec:
  selector:
    app: booking-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
